<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Loen</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              bgBody: '#0a0e1a',
              bgPanel: '#1a1f2e',
              bgSecondary: '#141824',
              bgHover: '#1e2437',
              textPrimary: '#e8eaed',
              textSecondary: '#9aa0a6',
              textHighlight: '#a78bfa',
              accentYellow: '#f59e0b',
              accentBlue: '#60a5fa',
              accentPink: '#f472b6',
              accentGreen: '#34d399',
              borderColor: '#2a2f3e',
              errorColor: '#ef4444',
            },
            fontFamily: {
              sans: ['Poppins', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #0a0e1a;
        color: #e8eaed;
      }
      /* Starry background animation */
      .stars-bg {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image:
            radial-gradient(2px 2px at 20px 30px, rgba(255, 255, 255, 0.3), transparent),
            radial-gradient(2px 2px at 60px 70px, rgba(255, 255, 255, 0.2), transparent),
            radial-gradient(1px 1px at 50px 50px, rgba(255, 255, 255, 0.4), transparent),
            radial-gradient(1px 1px at 130px 80px, rgba(255, 255, 255, 0.3), transparent),
            radial-gradient(2px 2px at 90px 10px, rgba(255, 255, 255, 0.2), transparent);
        background-size: 200px 200px;
        animation: stars 60s linear infinite;
        pointer-events: none;
        z-index: 0;
      }
      @keyframes stars {
        from { transform: translateY(0); }
        to { transform: translateY(-200px); }
      }
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #0a0e1a; 
      }
      ::-webkit-scrollbar-thumb {
        background: #2a2f3e; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #374151; 
      }
    </style>

<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div class="stars-bg"></div>
    <div id="root" class="relative z-10"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
